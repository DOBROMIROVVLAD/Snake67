<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка — Онлайн версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            width: 1300px;
            max-width: 100%;
            background: #f0f2f6;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }
        .sidebar {
            width: 260px;
            background: #0f172a;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }
        .logo {
            padding: 32px 24px 20px 28px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 22px;
            font-weight: bold;
            color: white;
        }
        .logo span { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            color: #cbd5e1;
        }
        .nav-item i { width: 24px; font-size: 1.2rem; }
        .nav-item.active {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border-left: 3px solid #38bdf8;
        }
        .nav-item:hover:not(.disabled) { background: #2d3748; color: #e2e8f0; }
        .disabled { opacity: 0.5; cursor: not-allowed; }
        .sidebar-footer { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 11px; text-align: center; color: #5b6e8c; }
        .main-content { flex: 1; background: #f4f6fa; padding: 24px 30px; overflow-y: auto; min-height: 600px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05); border: 1px solid #edf2f7; }
        .btn { background: #3182ce; color: white; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #2b6cb0; transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid #3182ce; color: #3182ce; }
        .btn-outline:hover { background: #ebf8ff; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .game-canvas { background: white; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); display: block; margin: 0 auto; }
        .info-panel { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
        .difficulty-buttons button { margin-right: 12px; padding: 8px 20px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; }
        .difficulty-buttons .easy { background: #10b981; color: white; }
        .difficulty-buttons .medium { background: #f59e0b; color: white; }
        .difficulty-buttons .hard { background: #ef4444; color: white; }
        .leaderboard-table { width: 100%; border-collapse: collapse; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .color-palette { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .color-btn { width: 60px; height: 60px; border-radius: 12px; cursor: pointer; border: 3px solid transparent; transition: 0.1s; }
        .color-btn.selected { border-color: #2b6cb0; transform: scale(1.05); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 30px; width: 350px; max-width: 90%; }
        .modal-content input, .modal-content textarea { width: 100%; margin: 10px 0; padding: 10px; border-radius: 12px; border: 1px solid #cbd5e0; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .text-center { text-align: center; }
        .mt-20 { margin-top: 20px; }
        .mb-20 { margin-bottom: 20px; }
        .message-error { color: #e53e3e; font-size: 12px; margin-top: 5px; }
        @media (max-width: 800px) {
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; min-height: auto; }
            .nav-item { flex: 1; justify-content: center; }
            .main-content { padding: 20px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="logo"><span>🐍 SnakeCore</span></div>
        <div class="nav-item" data-page="profile"><i class="fas fa-user"></i> Профиль</div>
        <div class="nav-item" data-page="game"><i class="fas fa-gamepad"></i> Играть</div>
        <div class="nav-item" data-page="shop"><i class="fas fa-store"></i> Магазин</div>
        <div class="nav-item" data-page="inventory"><i class="fas fa-box"></i> Инвентарь</div>
        <div class="nav-item" data-page="leaderboard"><i class="fas fa-trophy"></i> Лидеры</div>
        <div class="nav-item" data-page="support"><i class="fas fa-headset"></i> Поддержка</div>
        <div class="sidebar-footer">v 2.0 • API-версия</div>
    </div>
    <div class="main-content" id="mainContent">
        <div id="pageContainer"></div>
    </div>
</div>

<script>
    // ---------- API Базовый URL (ИЗМЕНИТЕ ПРИ НЕОБХОДИМОСТИ) ----------
    const API_BASE = 'https://localhost:7215/api';  // замените на ваш реальный адрес API, включая порт

    // ---------- Глобальные переменные ----------
    let currentUser = null;

    // ---------- Работа с localStorage (сохранение сессии) ----------
    function saveUserToStorage(user) {
        if (user) {
            localStorage.setItem('snakeUser', JSON.stringify(user));
        } else {
            localStorage.removeItem('snakeUser');
        }
    }

    function loadUserFromStorage() {
        const stored = localStorage.getItem('snakeUser');
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) { return null; }
        }
        return null;
    }

    // ---------- Вспомогательная функция для HTTP запросов ----------
    async function apiRequest(endpoint, method, body = null) {
        const url = `${API_BASE}/${endpoint}`;
        const options = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };
        if (body) options.body = JSON.stringify(body);
        const response = await fetch(url, options);
        if (!response.ok) {
            let errorMsg;
            try {
                const err = await response.json();
                errorMsg = err.message || 'Ошибка запроса';
            } catch(e) {
                errorMsg = `Ошибка ${response.status}`;
            }
            throw new Error(errorMsg);
        }
        return response.json();
    }

    // ---------- Авторизация ----------
    function showLoginModal() {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2 class="text-center">🐍 Вход</h2>
                <input type="text" id="loginUser" placeholder="Логин">
                <input type="password" id="passUser" placeholder="Пароль">
                <div class="flex-between mt-20">
                    <button class="btn" id="doLogin">Войти</button>
                    <button class="btn btn-outline" id="openRegister">Регистрация</button>
                </div>
                <div id="loginMsg" class="message-error text-center"></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.style.display = 'flex';
        const closeModal = () => modal.remove();

        document.getElementById('doLogin').onclick = async () => {
            const login = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('passUser').value.trim();
            try {
                const user = await apiRequest('Auth/login', 'POST', { login, password });
                currentUser = user;
                saveUserToStorage(user);   // сохраняем сессию
                closeModal();
                renderCurrentPage();
                enableSidebar(true);
            } catch (err) {
                document.getElementById('loginMsg').innerText = err.message;
            }
        };
        document.getElementById('openRegister').onclick = () => {
            closeModal();
            showRegisterModal();
        };
    }

    async function showRegisterModal() {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2 class="text-center">📝 Регистрация</h2>
                <input type="text" id="regLogin" placeholder="Логин">
                <input type="password" id="regPass" placeholder="Пароль">
                <input type="password" id="regCode" placeholder="Кодовое слово (бобр - админ)">
                <button class="btn" id="doRegister">Зарегистрироваться</button>
                <div id="regMsg" class="message-error text-center"></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.style.display = 'flex';
        const close = () => modal.remove();

        document.getElementById('doRegister').onclick = async () => {
            const login = document.getElementById('regLogin').value.trim();
            const password = document.getElementById('regPass').value.trim();
            const codeWord = document.getElementById('regCode').value.trim();
            if (!login || !password) {
                document.getElementById('regMsg').innerText = 'Заполните все поля';
                return;
            }
            try {
                await apiRequest('Auth/register', 'POST', { login, password, codeWord });
                alert('Регистрация успешна! Теперь войдите.');
                close();
                showLoginModal();
            } catch (err) {
                document.getElementById('regMsg').innerText = err.message;
            }
        };
    }

    function enableSidebar(enabled) {
        document.querySelectorAll('.nav-item').forEach(el => {
            if (enabled) el.classList.remove('disabled');
            else el.classList.add('disabled');
        });
    }

    // ---------- Отрисовка страниц ----------
    let currentPage = 'profile';
    async function renderCurrentPage() {
        if (!currentUser) {
            // попробуем восстановить из localStorage
            const storedUser = loadUserFromStorage();
            if (storedUser) {
                currentUser = storedUser;
                enableSidebar(true);
                // не показываем модалку, просто рисуем страницу
            } else {
                showLoginModal();
                document.getElementById('pageContainer').innerHTML = '<div class="text-center">Пожалуйста, авторизуйтесь</div>';
                enableSidebar(false);
                return;
            }
        }
        enableSidebar(true);
        if (currentPage === 'profile') await renderProfile();
        else if (currentPage === 'game') renderGame();
        else if (currentPage === 'shop') await renderShop();
        else if (currentPage === 'inventory') await renderInventory();
        else if (currentPage === 'leaderboard') await renderLeaderboard();
        else if (currentPage === 'support') await renderSupport();
        else if (currentPage === 'admin') await renderAdmin();
    }

    // Профиль
    async function renderProfile() {
        try {
            // обновляем данные пользователя с сервера
            const user = await apiRequest('Auth/login', 'POST', { login: currentUser.login, password: currentUser.password });
            currentUser = user;
            saveUserToStorage(user);  // обновляем в хранилище
        } catch(e) {}
        const container = document.getElementById('pageContainer');
        container.innerHTML = `
            <div class="text-center"><h2>Профиль</h2><div class="card" style="max-width:400px; margin:auto;">
                <i class="fas fa-user-circle fa-4x" style="color:#3182ce"></i>
                <h3>${currentUser.login}</h3>
                <p>ID: ${currentUser.id}</p>
                <p>Сыграно игр: ${currentUser.sumPlay || 0}</p>
                <p>💰 Монет: ${currentUser.coins || 0}</p>
                <p>📊 Рекорды:</p>
                <ul style="text-align:left">
                    <li>Легкий: ${currentUser.lightRecord || 0} очков, время ${currentUser.lightTime || '00:00'}</li>
                    <li>Средний: ${currentUser.mediumRecord || 0} очков, время ${currentUser.mediumTime || '00:00'}</li>
                    <li>Сложный: ${currentUser.hardRecord || 0} очков, время ${currentUser.hardTime || '00:00'}</li>
                </ul>
                <button class="btn" id="logoutBtn">🚪 Выйти</button>
            </div></div>
        `;
        document.getElementById('logoutBtn').onclick = () => {
            currentUser = null;
            saveUserToStorage(null);
            renderCurrentPage();
        };
    }

    // ----- ИГРА -----
    let gameCleanup = null;
    function renderGame() {
        const container = document.getElementById('pageContainer');
        container.innerHTML = `
            <div class="info-panel">
                <div><strong>🐍 Счёт:</strong> <span id="gameScore">0</span></div>
                <div><strong>⏱️ Время:</strong> <span id="gameTime">00:00</span></div>
                <div class="difficulty-buttons">
                    <button class="easy" data-diff="Easy">🍃 Лёгкий</button>
                    <button class="medium" data-diff="Medium">⚡ Средний</button>
                    <button class="hard" data-diff="Hard">🔥 Сложный</button>
                </div>
                <button class="btn" id="startGameBtn">▶ Старт</button>
            </div>
            <canvas id="snakeCanvas" width="500" height="500" class="game-canvas" style="width:100%; max-width:500px; height:auto"></canvas>
        `;
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        let gameRunning = false;
        let snake = [], food = {}, direction = 'RIGHT', nextDir = 'RIGHT', score = 0;
        let gridSize = 20, cellSize = canvas.width / gridSize;
        let difficulty = 'Easy', speed = 150;
        let gameTimer = null, timeTimer = null;
        let gameTime = 0;

        function setGridSize() {
            if (difficulty === 'Easy') { gridSize = 15; cellSize = canvas.width / gridSize; }
            else if (difficulty === 'Medium') { gridSize = 20; cellSize = canvas.width / gridSize; }
            else { gridSize = 25; cellSize = canvas.width / gridSize; }
        }
        setGridSize();

        function drawGrid() {
            ctx.strokeStyle = '#ccc';
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i*cellSize,0); ctx.lineTo(i*cellSize,canvas.height); ctx.stroke();
                ctx.moveTo(0,i*cellSize); ctx.lineTo(canvas.width,i*cellSize); ctx.stroke();
            }
        }
        function drawSnake() {
            snake.forEach((seg, idx) => {
                ctx.fillStyle = idx === 0 ? (currentUser.headColor || '#2B6CB0') : (currentUser.bodyColor || '#38A169');
                ctx.fillRect(seg.x*cellSize, seg.y*cellSize, cellSize-1, cellSize-1);
            });
        }
        function drawFood() {
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x*cellSize, food.y*cellSize, cellSize-1, cellSize-1);
        }
        function generateFood() {
            let free = false;
            while (!free) {
                const fx = Math.floor(Math.random() * gridSize);
                const fy = Math.floor(Math.random() * gridSize);
                if (!snake.some(s => s.x === fx && s.y === fy)) {
                    food = { x: fx, y: fy };
                    free = true;
                }
            }
        }
        function updateUI() {
            document.getElementById('gameScore').innerText = score;
            const mins = Math.floor(gameTime / 60);
            const secs = gameTime % 60;
            document.getElementById('gameTime').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        function drawAll() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            drawGrid();
            drawFood();
            drawSnake();
        }
        function reset() {
            if (gameTimer) clearInterval(gameTimer);
            if (timeTimer) clearInterval(timeTimer);
            gameRunning = false;
            score = 0;
            gameTime = 0;
            updateUI();
            const sx = Math.floor(gridSize/2);
            const sy = Math.floor(gridSize/2);
            snake = [{x:sx,y:sy}, {x:sx-1,y:sy}, {x:sx-2,y:sy}];
            direction = 'RIGHT';
            nextDir = 'RIGHT';
            generateFood();
            drawAll();
        }
        function move() {
            direction = nextDir;
            const head = snake[0];
            let newHead = { ...head };
            switch(direction) {
                case 'UP': newHead.y--; break;
                case 'DOWN': newHead.y++; break;
                case 'LEFT': newHead.x--; break;
                case 'RIGHT': newHead.x++; break;
            }
            if (newHead.x < 0 || newHead.x >= gridSize || newHead.y < 0 || newHead.y >= gridSize || snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                gameOver();
                return;
            }
            snake.unshift(newHead);
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                updateUI();
                generateFood();
                if (score % 50 === 0 && speed > 40) {
                    speed = Math.max(40, speed - 10);
                    if (gameRunning) { clearInterval(gameTimer); gameTimer = setInterval(() => { if (gameRunning) move(); }, speed); }
                }
            } else {
                snake.pop();
            }
            drawAll();
        }
        async function gameOver() {
    gameRunning = false;
    if (gameTimer) clearInterval(gameTimer);
    if (timeTimer) clearInterval(timeTimer);
    const timeStr = `${Math.floor(gameTime/60).toString().padStart(2,'0')}:${(gameTime%60).toString().padStart(2,'0')}`;
    try {
        const updatedUser = await apiRequest('Game/save-result', 'POST', {
            login: currentUser.login,
            score: score,
            difficulty: difficulty,
            time: timeStr
        });
        if (updatedUser && updatedUser.login) {
            currentUser = updatedUser;
            saveUserToStorage(updatedUser);
        } else {
            // запасной вариант
            const fresh = await apiRequest('Auth/login', 'POST', { login: currentUser.login, password: currentUser.password });
            if (fresh && fresh.login) {
                currentUser = fresh;
                saveUserToStorage(fresh);
            }
        }
        alert(`Игра окончена! Счёт: ${score}\nВремя: ${timeStr}`);
        // Обновляем профиль в фоне, но НЕ переключаем страницу
        // Проверим, если текущая страница профиль, то обновим её, иначе просто сохраним данные
        if (currentPage === 'profile') {
            renderProfile();
        } else {
            // просто обновим данные пользователя в памяти, без перерисовки страницы
            // (чтобы при переходе в профиль позже были свежие данные)
        }
    } catch(e) {
        console.error(e);
        alert(`Ошибка сохранения: ${e.message}`);
    }
    reset(); // сброс игрового поля, остаёмся на странице игры
}
        function start() {
            reset();
            gameRunning = true;
            gameTimer = setInterval(() => { if (gameRunning) move(); }, speed);
            timeTimer = setInterval(() => { if (gameRunning) { gameTime++; updateUI(); } }, 1000);
        }
        function handleKey(e) {
            if (!gameRunning) return;
            const key = e.key;
            if ((key === 'ArrowUp' || key === 'w') && direction !== 'DOWN') nextDir = 'UP';
            else if ((key === 'ArrowDown' || key === 's') && direction !== 'UP') nextDir = 'DOWN';
            else if ((key === 'ArrowLeft' || key === 'a') && direction !== 'RIGHT') nextDir = 'LEFT';
            else if ((key === 'ArrowRight' || key === 'd') && direction !== 'LEFT') nextDir = 'RIGHT';
            else return;
            e.preventDefault();
        }
        // Удаляем предыдущий обработчик, чтобы не дублировать
        if (gameCleanup) window.removeEventListener('keydown', gameCleanup);
        window.addEventListener('keydown', handleKey);
        gameCleanup = handleKey;

        document.querySelectorAll('[data-diff]').forEach(btn => {
            btn.onclick = (e) => {
                difficulty = e.target.getAttribute('data-diff');
                if (difficulty === 'Easy') speed = 150;
                else if (difficulty === 'Medium') speed = 130;
                else speed = 110;
                setGridSize();
                reset();
            };
        });
        document.getElementById('startGameBtn').onclick = start;
        reset();
    }

    // Магазин
    async function renderShop() {
        const [shopItems, userItems] = await Promise.all([
            apiRequest('Shop/items', 'GET'),
            apiRequest(`Shop/inventory/${currentUser.login}`, 'GET')
        ]);
        const ownedIds = userItems;
        const container = document.getElementById('pageContainer');
        container.innerHTML = `<h2>🛒 Магазин цветов</h2><div>💰 Монет: ${currentUser.coins}</div><div id="shopList"></div>`;
        const listDiv = document.getElementById('shopList');
        async function refreshShop() {
            const updatedUser = await apiRequest('Auth/login', 'POST', { login: currentUser.login, password: currentUser.password });
            currentUser = updatedUser;
            saveUserToStorage(updatedUser);
            renderShop();
        }
        listDiv.innerHTML = '';
        for (const item of shopItems) {
            if (item.price === 0) continue;
            const owned = ownedIds.includes(item.id);
            const card = document.createElement('div'); card.className = 'card'; card.style.marginBottom = '10px';
            card.innerHTML = `
                <div class="flex-between">
                    <div><div style="width:40px;height:40px;background:${item.colorCode};border-radius:8px;"></div> ${item.displayName}</div>
                    <div>💰 ${item.price}</div>
                    <button class="btn" data-id="${item.id}" ${owned ? 'disabled' : ''}>${owned ? 'Куплено' : 'Купить'}</button>
                </div>
            `;
            if (!owned) {
                const btn = card.querySelector('button');
                btn.onclick = async () => {
                    try {
                        await apiRequest('Shop/purchase', 'POST', { userLogin: currentUser.login, itemId: item.id });
                        await refreshShop();
                    } catch(err) { alert(err.message); }
                };
            }
            listDiv.appendChild(card);
        }
    }

    // Инвентарь
    // Инвентарь
async function renderInventory() {
    const [shopItems, userItems] = await Promise.all([
        apiRequest('Shop/items', 'GET'),
        apiRequest(`Shop/inventory/${currentUser.login}`, 'GET')
    ]);
    const ownedItems = shopItems.filter(item => userItems.includes(item.id));
    const headItems = ownedItems.filter(i => i.itemType === 'Head');
    const bodyItems = ownedItems.filter(i => i.itemType === 'Body');
    const container = document.getElementById('pageContainer');
    container.innerHTML = `<h2>📦 Инвентарь</h2><div><h3>Цвета головы</h3><div id="headColors" class="color-palette"></div><h3>Цвета тела</h3><div id="bodyColors" class="color-palette"></div><div id="preview" class="card mt-20">Предпросмотр: <div style="display:flex;gap:10px"><div id="previewHead" style="width:50px;height:50px;background:${currentUser.headColor};border-radius:8px"></div><div id="previewBody" style="width:50px;height:50px;background:${currentUser.bodyColor};border-radius:8px"></div></div></div></div>`;
    const headDiv = document.getElementById('headColors');
    const bodyDiv = document.getElementById('bodyColors');
    
    // Универсальная функция обновления пользователя
    async function refreshUser() {
        try {
            const updated = await apiRequest('Auth/login', 'POST', { login: currentUser.login, password: currentUser.password });
            if (updated && updated.login) {
                currentUser = updated;
                saveUserToStorage(updated);
                return true;
            }
        } catch(e) { console.warn(e); }
        return false;
    }

    headItems.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'color-btn' + (currentUser.headColor === item.colorCode ? ' selected' : '');
        btn.style.backgroundColor = item.colorCode;
        btn.onclick = async () => {
            try {
                // Отправляем запрос на смену цвета
                const resp = await apiRequest('Shop/update-color', 'POST', { 
                    userLogin: currentUser.login, 
                    type: 'Head', 
                    colorCode: item.colorCode 
                });
                // Если API вернул обновлённого пользователя, используем его, иначе обновляем отдельно
                if (resp && resp.login) {
                    currentUser = resp;
                    saveUserToStorage(resp);
                } else {
                    await refreshUser();
                }
                // Перерисовываем инвентарь
                renderInventory();
            } catch (err) {
                console.error('Ошибка смены цвета головы:', err);
                alert('Не удалось изменить цвет: ' + err.message);
            }
        };
        headDiv.appendChild(btn);
    });

    bodyItems.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'color-btn' + (currentUser.bodyColor === item.colorCode ? ' selected' : '');
        btn.style.backgroundColor = item.colorCode;
        btn.onclick = async () => {
            try {
                const resp = await apiRequest('Shop/update-color', 'POST', { 
                    userLogin: currentUser.login, 
                    type: 'Body', 
                    colorCode: item.colorCode 
                });
                if (resp && resp.login) {
                    currentUser = resp;
                    saveUserToStorage(resp);
                } else {
                    await refreshUser();
                }
                renderInventory();
            } catch (err) {
                console.error('Ошибка смены цвета тела:', err);
                alert('Не удалось изменить цвет: ' + err.message);
            }
        };
        bodyDiv.appendChild(btn);
    });
}

    // Поддержка
    async function renderSupport() {
        const container = document.getElementById('pageContainer');
        container.innerHTML = `<h2>📞 Поддержка</h2><div class="card"><textarea id="supportMsg" rows="4" placeholder="Опишите вашу проблему..."></textarea><button class="btn mt-20" id="sendSupport">Отправить</button><div id="supportStatus"></div></div>`;
        document.getElementById('sendSupport').onclick = async () => {
            const msg = document.getElementById('supportMsg').value.trim();
            if (!msg) return;
            try {
                await apiRequest('Support/send', 'POST', { userLogin: currentUser.login, messageText: msg, sentDate: new Date().toISOString() });
                document.getElementById('supportStatus').innerText = 'Сообщение отправлено администратору.';
                document.getElementById('supportMsg').value = '';
            } catch(err) {
                document.getElementById('supportStatus').innerText = err.message;
            }
        };
    }

    // Админка
    async function renderAdmin() {
        if (currentUser.roleId !== 1) { renderProfile(); return; }
        const [users, messages] = await Promise.all([
            apiRequest('Admin/users', 'GET'),
            apiRequest('Support/messages?onlyOpen=true', 'GET')
        ]);
        const container = document.getElementById('pageContainer');
        container.innerHTML = `<h2>👑 Панель администратора</h2><div class="card"><h3>Пользователи</h3><table class="leaderboard-table"><tr><th>ID</th><th>Логин</th><th>Бан</th><th></th></tr>${users.map(u=>`<tr><td>${u.id}</td><td>${u.login}</td><td><input type="checkbox" class="banCheck" data-login="${u.login}" ${u.isBanned ? 'checked' : ''}></td><td><button class="btn saveBan" data-login="${u.login}">Сохранить</button></td></tr>`).join('')}</table></div><div class="card mt-20"><h3>Обращения в поддержку</h3><ul>${messages.map(m=>`<li><strong>${m.userLogin}</strong> (${new Date(m.sentDate).toLocaleString()}): ${m.messageText} <button class="btn closeMsg" data-id="${m.id}">Закрыть</button></li>`).join('')}</ul></div>`;
        document.querySelectorAll('.saveBan').forEach(btn => {
            btn.onclick = async () => {
                const login = btn.getAttribute('data-login');
                const chk = btn.closest('tr').querySelector('.banCheck');
                const isBanned = chk.checked;
                await apiRequest(`Admin/ban/${login}`, 'POST', isBanned);
                renderAdmin();
            };
        });
        document.querySelectorAll('.closeMsg').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.getAttribute('data-id');
                await apiRequest(`Support/close/${id}`, 'POST');
                renderAdmin();
            };
        });
    }

    // Навигация
    function setupNavigation() {
        document.querySelectorAll('.nav-item').forEach(el => {
            el.onclick = () => {
                if (el.classList.contains('disabled')) return;
                const page = el.getAttribute('data-page');
                if (page === 'admin' && currentUser?.roleId !== 1) return;
                currentPage = page;
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                el.classList.add('active');
                renderCurrentPage();
            };
        });
        const adminItem = document.createElement('div');
        adminItem.className = 'nav-item';
        adminItem.setAttribute('data-page', 'admin');
        adminItem.innerHTML = '<i class="fas fa-shield-alt"></i> Админ';
        adminItem.onclick = () => {
            if (currentUser?.roleId === 1) {
                currentPage = 'admin';
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                adminItem.classList.add('active');
                renderCurrentPage();
            }
        };
        document.querySelector('.sidebar').insertBefore(adminItem, document.querySelector('.sidebar-footer'));
    }

    setupNavigation();
    renderCurrentPage();
</script>
